name: Test docs

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  mkdocs:
    name: MkDocs strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # --strict fails on broken links, missing nav files and config warnings
      - run: mkdocs build --strict

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lex-docs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Serve and check pages
        run: |
          docker run -d --name docs -p 8080:80 lex-docs:test
          for i in $(seq 1 15); do
            curl -fs -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Project Lex Documentation"
          curl -fsS -o /dev/null http://localhost:8080/technical/
          curl -fsS -o /dev/null http://localhost:8080/search/search_index.json

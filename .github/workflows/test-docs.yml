name: Test docs

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    name: Zensical strict build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # Debian's plantuml package is from 2020 (no `!theme`), so use the same
      # upstream jar as the Dockerfile (keep PLANTUML_VERSION in sync)
      - name: Install PlantUML
        env:
          PLANTUML_VERSION: "1.2026.10"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends default-jre-headless graphviz
          sudo curl -fsSL -o /opt/plantuml.jar \
            "https://github.com/plantuml/plantuml/releases/download/v${PLANTUML_VERSION}/plantuml-${PLANTUML_VERSION}.jar"
          printf '#!/bin/sh\nexec java -Djava.awt.headless=true -jar /opt/plantuml.jar "$@"\n' | sudo tee /usr/local/bin/plantuml > /dev/null
          sudo chmod +x /usr/local/bin/plantuml
          plantuml -version

      - run: pip install -r requirements.txt

      # --strict aborts the build on warnings
      # plantuml_markdown only logs diagram errors, so fail on them explicitly
      - run: |
          zensical build --clean --strict 2>&1 | tee build.log
          ! grep -q "Error in" build.log

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lex-docs:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Serve and check pages
        run: |
          docker run -d --name docs -p 8080:80 lex-docs:test
          for i in $(seq 1 15); do
            curl -fs -o /dev/null http://localhost:8080/ && break
            sleep 1
          done
          curl -fsS http://localhost:8080/ | grep -q "Project Lex Documentation"
          curl -fsS -o /dev/null http://localhost:8080/technical/
          curl -fsS -o /dev/null http://localhost:8080/search.json
